name: W10M Release

# GitHub-hosted Windows runner.
# The runner image does not include v141 ARM/UWP or Windows SDK 15063, so the
# workflow installs them before building. This makes the job slower than a
# self-hosted runner, but requires no local machine.
#
# Optional repository secrets:
#   W10M_CERT_PFX_BASE64  base64-encoded signing .pfx
#   W10M_CERT_PASSWORD    password for that .pfx
# If the secret is absent, CI generates a temporary self-signed certificate
# matching the manifest Publisher and uploads cert.cer with the package.

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
      - ci_debug
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (x.y.z)'
        required: true
        default: '1.18.3'

permissions:
  contents: write

concurrency:
  group: w10m-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Same-repository PRs, master pushes, tags and manual runs are allowed.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2022
    timeout-minutes: 240
    env:
      TMP: ${{ github.workspace }}\build-tmp
      TEMP: ${{ github.workspace }}\build-tmp
      # Never expose the release signing key to pull-request code.
      CERT_PFX_BASE64: ${{ github.event_name != 'pull_request' && secrets.W10M_CERT_PFX_BASE64 || '' }}
      CERT_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.W10M_CERT_PASSWORD || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Ensure vcpkg-compatible Git
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $required = [version]'2.55.0'
          $text = (& git --version).Trim()
          Write-Host "Initial Git: $text"
          if ($text -match '(\d+\.\d+\.\d+)') {
            $current = [version]$Matches[1]
          } else {
            $current = [version]'0.0.0'
          }
          if ($current -lt $required) {
            Write-Host 'Installing a newer Git for vcpkg...'
            choco install git --yes --force --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco install git failed: $LASTEXITCODE" }
            $env:PATH = "C:\Program Files\Git\cmd;$env:PATH"
          }
          $text = (& git --version).Trim()
          Write-Host "Final Git: $text"
          if ($text -match '(\d+\.\d+\.\d+)') {
            $current = [version]$Matches[1]
          } else {
            throw "Cannot parse Git version: $text"
          }
          if ($current -lt $required) { throw "Git >= $required is required by vcpkg, got $current" }

      - name: Create writable build temp
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path $env:TMP | Out-Null
          Write-Host "TMP=$env:TMP"

      - name: Install v141 ARM/UWP toolset
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installPath = & $vswhere -latest -products * -property installationPath
          if (-not $installPath) { throw 'Visual Studio installation not found' }
          $installer = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vs_installer.exe'
          if (-not (Test-Path $installer)) { throw 'vs_installer.exe not found' }

          & $installer modify `
            --installPath "$installPath" `
            --add Microsoft.VisualStudio.Workload.NativeDesktop `
            --add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            --add Microsoft.VisualStudio.Component.VC.v141.x86.x64 `
            --add Microsoft.VisualStudio.Component.VC.v141.ARM `
            --add Microsoft.VisualStudio.ComponentGroup.UWP.VC.v141 `
            --includeRecommended `
            --quiet --norestart --wait

          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3010) {
            throw "VS Installer failed: $LASTEXITCODE"
          }

          Write-Host 'MSVC tools after install:'
          Get-ChildItem (Join-Path $installPath 'VC\Tools\MSVC') -Directory -ErrorAction SilentlyContinue |
            Select-Object Name

      - name: Install Windows SDK 15063
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Include\10.0.15063.0'
          $sdkHeader = Join-Path $sdk 'um\windows.h'
          if (Test-Path $sdkHeader) {
            Write-Host 'Windows SDK 15063 already present'
            exit 0
          }

          $sdkReady = Test-Path $sdkHeader
          for ($attempt = 1; $attempt -le 3 -and -not $sdkReady; $attempt++) {
            Write-Host "SDK 15063 install attempt $attempt"

            # The standalone 15063 installer is from the Windows 10 era and can
            # return 1001 on Windows Server 2022. Try it, then fall back to the
            # VS2017 UWP build tools, which carry the same SDK components.
            try {
              Invoke-WebRequest `
                -Uri 'https://go.microsoft.com/fwlink/?linkid=845298' `
                -OutFile winsdksetup.exe
              Unblock-File .\winsdksetup.exe
              Write-Host "SDK installer: $((Get-Item .\winsdksetup.exe).VersionInfo.FileVersion)"
              $p = Start-Process -FilePath .\winsdksetup.exe `
                -ArgumentList @('/features', '+', '/quiet', '/norestart') `
                -Wait -PassThru
              Write-Host "SDK installer exit: $($p.ExitCode)"
            } catch {
              Write-Host "::warning::Standalone Windows SDK installer failed: $($_.Exception.Message)"
            }

            if (-not (Test-Path $sdkHeader)) {
              try {
                Write-Host 'Falling back to Visual Studio 2017 Build Tools UWP SDK'
                Invoke-WebRequest `
                  -Uri 'https://aka.ms/vs/15/release/vs_buildtools.exe' `
                  -OutFile vs_buildtools_2017.exe
                Unblock-File .\vs_buildtools_2017.exe

                $p = Start-Process -FilePath .\vs_buildtools_2017.exe `
                  -ArgumentList @(
                    '--quiet', '--wait', '--norestart', '--nocache',
                    '--installPath', 'C:\BuildTools2017',
                    '--add', 'Microsoft.VisualStudio.Workload.UniversalBuildTools',
                    '--add', 'Microsoft.VisualStudio.Component.VC.v141.ARM',
                    '--add', 'Microsoft.VisualStudio.Component.Windows10SDK.15063.UWP.Native',
                    '--add', 'Microsoft.VisualStudio.Component.Windows10SDK.15063.UWP'
                  ) `
                  -Wait -PassThru
                Write-Host "VS2017 Build Tools exit: $($p.ExitCode)"
                if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
                  Write-Host "::warning::VS2017 Build Tools installer exit: $($p.ExitCode)"
                }
              } catch {
                Write-Host "::warning::VS2017 Build Tools fallback failed: $($_.Exception.Message)"
              }
            }

            $sdkReady = Test-Path $sdkHeader
            if (-not $sdkReady) { Start-Sleep -Seconds 20 }
          }

          if (-not $sdkReady) {
            throw 'Windows SDK 15063 installation did not produce the expected headers after 3 attempts'
          }

      # v141 ARM/UWP components can only be resolved after the matching
      # 15063 SDK is present. Retry the component install at this point.
      - name: Install v141 after Windows SDK 15063
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installPath = & $vswhere -latest -products * -property installationPath
          if (-not $installPath) { throw 'Visual Studio installation not found' }

          $setup = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\setup.exe'
          if (-not (Test-Path $setup)) { throw 'Visual Studio setup.exe not found' }

          $channelId = & $vswhere -latest -products * -property channelId
          $productId = & $vswhere -latest -products * -property productId
          if (-not $channelId) { $channelId = 'VisualStudio.17.Release' }
          if (-not $productId) { $productId = 'Microsoft.VisualStudio.Product.Enterprise' }
          Write-Host "channelId=$channelId productId=$productId"

          # setup.exe refuses --quiet when the caller is an admin but not an
          # elevated process. Run the modify operation through a SYSTEM task so
          # it starts with a full token without needing an interactive UAC prompt.
          $taskName = 'w10m-install-v141'
          $argLine = (
            'modify --installPath "{0}" --channelId {1} --productId {2} ' +
            '--add Microsoft.VisualStudio.Component.VC.v141.x86.x64 ' +
            '--add Microsoft.VisualStudio.Component.VC.v141.ARM ' +
            '--add Microsoft.VisualStudio.ComponentGroup.UWP.VC.v141 ' +
            '--includeRecommended --quiet --norestart'
          ) -f $installPath, $channelId, $productId

          $action = New-ScheduledTaskAction -Execute $setup -Argument $argLine
          $principal = New-ScheduledTaskPrincipal -UserId 'SYSTEM' -LogonType ServiceAccount -RunLevel Highest
          Unregister-ScheduledTask -TaskName $taskName -Confirm:$false -ErrorAction SilentlyContinue
          Register-ScheduledTask -TaskName $taskName -Action $action -Principal $principal -Force | Out-Null
          Start-ScheduledTask -TaskName $taskName

          $deadline = (Get-Date).AddMinutes(20)
          do {
            Start-Sleep -Seconds 5
            $task = Get-ScheduledTask -TaskName $taskName
            $info = Get-ScheduledTaskInfo -TaskName $taskName
          } while ($task.State -eq 'Running' -and (Get-Date) -lt $deadline)

          Write-Host "SYSTEM setup task state: $($task.State) result: $($info.LastTaskResult)"
          Unregister-ScheduledTask -TaskName $taskName -Confirm:$false -ErrorAction SilentlyContinue
          if ($task.State -eq 'Running') {
            throw 'SYSTEM v141 install task timed out'
          }
          if ($info.LastTaskResult -ne 0 -and $info.LastTaskResult -ne 3010) {
            throw "SYSTEM v141 install failed: $($info.LastTaskResult)"
          }

          Write-Host 'MSVC tools after v141 retry:'
          Get-ChildItem (Join-Path $installPath 'VC\Tools\MSVC') -Directory -ErrorAction SilentlyContinue |
            Select-Object Name

      - name: Cache vcpkg downloads
        uses: actions/cache@v4
        with:
          path: |
            vcpkg/downloads
          key: vcpkg-downloads-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'patches/vcpkg.patch') }}

      - name: Apply submodule patches
        shell: cmd
        run: apply-submodule-patches.cmd

      - name: Verify vcpkg patch
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $detect = 'vcpkg\scripts\detect_compiler\CMakeLists.txt'
          if (-not (Test-Path $detect)) { throw "Patched vcpkg file missing: $detect" }
          if (-not (Select-String -Path $detect -Pattern 'WindowsStore')) {
            throw 'vcpkg detect_compiler is not patched for WindowsStore'
          }
          git -C vcpkg diff --stat

      - name: Set package version
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $setVersion = $false
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'
            $setVersion = $true
          } elseif ('${{ github.event_name }}' -eq 'push' -and '${{ github.ref_type }}' -eq 'tag') {
            $version = '${{ github.ref_name }}'.TrimStart('v')
            $setVersion = $true
          } else {
            # PR / master validation builds keep the manifest version.
            $manifestText = [IO.File]::ReadAllText('Package.appxmanifest')
            $match = [regex]::Match($manifestText, 'Version="(\d+\.\d+\.\d+)\.\d+"')
            if (-not $match.Success) { throw 'Cannot read package version from manifest' }
            $version = $match.Groups[1].Value
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid version '$version'; expected x.y.z"
          }

          if ($setVersion) {
            $manifest = 'Package.appxmanifest'
            $text = [IO.File]::ReadAllText($manifest)
            $text = [regex]::Replace(
              $text,
              '(<Identity\b[^>]*?\bVersion=")[^"]+(")',
              ('${1}' + $version + '.0${2}'))
            [IO.File]::WriteAllText($manifest, $text, [Text.UTF8Encoding]::new($false))
          }

          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          Write-Host "Package version: $version.0 (setVersion=$setVersion)"

      - name: Prepare signing certificate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $password = $env:CERT_PASSWORD
          $manifest = Get-Content Package.appxmanifest -Raw
          $publisher = [regex]::Match($manifest, 'Publisher="([^"]+)"').Groups[1].Value
          if (-not $publisher) { throw 'Manifest Publisher not found' }

          if ([string]::IsNullOrWhiteSpace($env:CERT_PFX_BASE64)) {
            if ([string]::IsNullOrWhiteSpace($password)) {
              $password = [Guid]::NewGuid().ToString('N')
            }
            $cert = New-SelfSignedCertificate `
              -Type Custom `
              -Subject $publisher `
              -KeyUsage DigitalSignature `
              -FriendlyName 'W10M CI' `
              -CertStoreLocation 'Cert:\CurrentUser\My' `
              -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
            $secure = ConvertTo-SecureString -String $password -Force -AsPlainText
            Export-PfxCertificate -Cert $cert -FilePath cert.pfx -Password $secure | Out-Null
            Write-Host "Generated temporary certificate for $publisher"
          } else {
            if ([string]::IsNullOrWhiteSpace($password)) {
              throw 'W10M_CERT_PASSWORD is required when W10M_CERT_PFX_BASE64 is set'
            }
            $bytes = [Convert]::FromBase64String(($env:CERT_PFX_BASE64 -replace '\s', ''))
            [IO.File]::WriteAllBytes('cert.pfx', $bytes)
          }

          $x509 = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2 `
            -ArgumentList @((Resolve-Path cert.pfx).Path, $password)
          [IO.File]::WriteAllBytes(
            'cert.cer',
            $x509.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))

          $securePassword = ConvertTo-SecureString -String $password -Force -AsPlainText
          $imported = Import-PfxCertificate `
            -FilePath cert.pfx `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -Password $securePassword `
            -Exportable
          "W10M_CERT_THUMBPRINT=$($imported.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          "W10M_CERT_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          Write-Host "Certificate subject: $($x509.Subject)"
          Write-Host "Certificate thumbprint: $($imported.Thumbprint)"

      - name: Check v141/15063 toolchain
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw 'vswhere.exe not found' }

          $installPath = & $vswhere -latest -products * -property installationPath
          $v141Path = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.v141.ARM `
            -property installationPath
          $uwpPath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.ComponentGroup.UWP.VC.v141 `
            -property installationPath

          Write-Host "VS install: $installPath"
          Write-Host "v141 ARM component: $v141Path"
          Write-Host "UWP v141 component: $uwpPath"
          Write-Host 'MSVC tools:'
          Get-ChildItem (Join-Path $installPath 'VC\Tools\MSVC') -Directory -ErrorAction SilentlyContinue |
            Select-Object Name
          Write-Host 'SDK includes:'
          Get-ChildItem (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Include') -Directory -ErrorAction SilentlyContinue |
            Select-Object Name

          if (-not $installPath) { throw 'Visual Studio installation not found' }
          $msbuild = Join-Path $installPath 'MSBuild\Current\Bin\MSBuild.exe'
          if (-not (Test-Path $msbuild)) { throw "MSBuild not found: $msbuild" }

          $sdk = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Include\10.0.15063.0'
          if (-not (Test-Path (Join-Path $sdk 'um\windows.h'))) {
            throw 'Windows SDK 10.0.15063.0 is missing on this runner'
          }

          $v141Tools = Get-ChildItem (Join-Path $installPath 'VC\Tools\MSVC') -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like '14.16.*' } |
            Select-Object -First 1
          if (-not $v141Tools) {
            throw "v141 compiler tools are missing under $installPath"
          }
          if (-not $uwpPath) {
            Write-Warning 'UWP v141 component was not reported by vswhere; continuing with v141 ARM tools and SDK 15063'
          }

          "MSBUILD_PATH=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

      - name: Build via one-shot script
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\build-w10m.ps1 -Clean -CertificateThumbprint $env:W10M_CERT_THUMBPRINT

      - name: Show main build failure tail
        if: failure()
        shell: powershell
        run: |
          $mainLog = 'build-logs\build_and_package_Appx.raw.log'
          if (Test-Path $mainLog) {
            Get-Content $mainLog -Tail 20 | ForEach-Object { Write-Output "::error::$_" }
          } else {
            Write-Output '::error::build_and_package_Appx.raw.log not found'
          }
          # The one-shot script can fail before the Appx step. Annotations are
          # capped, so print only the diagnostic lines from each stage log.
          $stageLogs = @(
            'build-logs\install_vcpkg_dependencies.raw.log',
            'build-logs\generate_third-party_projects.raw.log',
            'build-logs\build_moonlight-common-c_and_enet.raw.log',
            'build-logs\build_gamestream.raw.log',
            'build-logs\build_and_package_Appx.raw.log'
          )
          foreach ($rel in $stageLogs) {
            if (-not (Test-Path $rel)) { continue }
            Write-Output "::error::=== $rel ==="
            $hits = Select-String -Path $rel -Pattern 'error|Error|FAILED|fatal|not found|cannot|CMake Error' -ErrorAction SilentlyContinue |
              Select-Object -First 12
            foreach ($h in $hits) {
              $line = $h.Line.Trim()
              if ($line.Length -gt 220) { $line = $line.Substring(0, 220) }
              Write-Output "::error::$line"
            }
          }

      - name: Upload one-shot build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: one-shot-build-logs
          path: build-logs/**
          if-no-files-found: ignore

      - name: Collect release files
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $appx = Get-ChildItem 'ARM\Release\AppPackages' -Recurse -Filter '*.appx' |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $appx) { throw 'No .appx produced' }

          $bundleName = "moonlight-w10m_$($env:RELEASE_VERSION).0_ARM"
          $bundle = Join-Path $PWD $bundleName
          Remove-Item $bundle -Recurse -Force -ErrorAction SilentlyContinue
          New-Item $bundle -ItemType Directory | Out-Null

          # Artifact branding is independent of the phone-visible DisplayName.
          # The manifest still says "Moonlight UWP"; only the file/folder names change.
          $artifactBase = $bundleName
          Copy-Item $appx.FullName (Join-Path $bundle "$artifactBase.appx")
          Copy-Item 'cert.cer' (Join-Path $bundle "$artifactBase.cer")
          $deps = Join-Path $appx.Directory 'Dependencies\ARM\*.appx'
          if (Test-Path $deps) {
            $depDir = Join-Path $bundle 'Dependencies\ARM'
            New-Item $depDir -ItemType Directory -Force | Out-Null
            Copy-Item $deps $depDir
          }

          $zip = Join-Path $PWD "$bundleName.zip"
          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path $bundle -DestinationPath $zip
          Get-ChildItem $bundle -Recurse -File | Format-Table FullName, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-w10m-${{ env.RELEASE_VERSION }}
          path: |
            moonlight-w10m_*_ARM/**
            moonlight-w10m_*_ARM.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            moonlight-w10m_*_ARM/**
            moonlight-w10m_*_ARM.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
